name: validate-skills

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate skills against SKILL_SPEC.md
        run: python3 tools/validate_skills.py

      - name: Self-test the validator
        run: python3 tools/test_validate_skills.py

      - name: Shell script syntax check
        run: find . -name '*.sh' -not -path './.git/*' -exec bash -n {} +

      - name: Python script syntax check
        run: python3 -m compileall -q tools */scripts

      - name: Structured event producer tests
        run: node --test tools/test_run_events.mjs
