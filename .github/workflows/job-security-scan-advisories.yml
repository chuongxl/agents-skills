name: job-security-scan-advisory-watch

# Daily: fetch vendor advisories, match them against this repository, open one issue per new hit.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be opened, create nothing"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .advisory-cache
          key: advisories-${{ github.run_id }}
          restore-keys: advisories-
      - name: Watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        run: |
          python3 -I job-security-scan/scripts/advisory-watch.py \
            --github-repo "$GH_REPO" --cache .advisory-cache --target . $DRY_RUN
