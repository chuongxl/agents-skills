name: job-security-scan-tests

on:
  push:
    branches: [main]
    paths:
      - "job-security-scan/**"
      - ".github/workflows/job-security-scan-e2e.yml"
  pull_request:
    paths:
      - "job-security-scan/**"
      - ".github/workflows/job-security-scan-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Advisory library tests
        run: python3 -I job-security-scan/scripts/test-advisory-lib.py
      - name: Ecosystem tests
        run: python3 -I job-security-scan/scripts/test-ecosystems.py
      - name: Advisory engine tests
        run: python3 -I job-security-scan/scripts/test-engine.py
      - name: Advisory data validates
        run: python3 -I job-security-scan/scripts/validate-advisories.py --strict
      - name: Ecosystem descriptors validate
        run: python3 -I job-security-scan/scripts/detect-ecosystems.py --validate
      - name: Shai-Hulud detector tests
        run: python3 -I job-security-scan/scripts/test-shai-hulud.py
      - name: Hardening tests (injection, secret leaks, installer checksums, sandboxed probe)
        run: python3 -I job-security-scan/scripts/test-hardening.py
      - name: Report tests (security-run folder, md/json/html, file:line)
        run: python3 -I job-security-scan/scripts/test-reports.py
      - name: Shai-Hulud indicator data validates
        run: |
          python3 -I - <<'PY'
          import sys
          sys.path.insert(0, "job-security-scan/scripts/lib")
          from shaihulud import iocs
          ioc = iocs.load()
          print("indicators %s: %d packages, %d files, %d paths, %d markers" % (
              ioc.version, len(ioc.packages), len(ioc.files), len(ioc.paths), len(ioc.markers)))
          PY
      - name: Shai-Hulud end-to-end (real run-scan.sh, repo + host mode)
        run: bash job-security-scan/tests/e2e/run-shai-hulud-e2e.sh

  e2e:
    name: Real scanners on fixtures (osv-scanner + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Pinned, checksum-verified scanner versions - the same pins as scripts/install-tools.sh.
      # Trivy v0.69.3 is an immutable release; v0.69.4 was malicious (GHSA-69fq-xp46-6x23).
      - name: Install osv-scanner v2.7.0 (verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.0 --repo google/osv-scanner \
            --pattern 'osv-scanner_linux_amd64' --pattern 'osv-scanner_SHA256SUMS' --dir osv \
            || { echo "::error::could not download osv-scanner v2.7.0"; exit 1; }
          (cd osv && grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check --strict) \
            || { echo "::error::osv-scanner checksum mismatch"; exit 1; }
          sudo install -m 0755 osv/osv-scanner_linux_amd64 /usr/local/bin/osv-scanner

      - name: Install trivy v0.69.3 (verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.69.3 --repo aquasecurity/trivy \
            --pattern 'trivy_0.69.3_Linux-64bit.tar.gz' --pattern 'trivy_0.69.3_checksums.txt' --dir trv \
            || { echo "::error::could not download trivy v0.69.3"; exit 1; }
          (cd trv && grep ' trivy_0.69.3_Linux-64bit.tar.gz$' trivy_0.69.3_checksums.txt | sha256sum --check --strict) \
            || { echo "::error::trivy checksum mismatch"; exit 1; }
          tar -xzf trv/trivy_0.69.3_Linux-64bit.tar.gz -C trv trivy
          sudo install -m 0755 trv/trivy /usr/local/bin/trivy

      - name: Tool versions
        run: |
          osv-scanner --version
          trivy --version

      - name: Every Semgrep ruleset in the descriptors exists in the registry
        run: |
          python3 - <<'PY'
          import glob, json, sys, urllib.request, urllib.error
          rulesets = sorted({r for f in glob.glob("job-security-scan/ecosystems/*.json")
                             for r in json.load(open(f)).get("semgrep", [])})
          bad = []
          for r in rulesets:
              try:
                  code = urllib.request.urlopen("https://semgrep.dev/c/" + r, timeout=30).status
              except urllib.error.HTTPError as e:
                  code = e.code
              print(r, code)
              if code != 200:
                  bad.append(r)
          sys.exit("unknown rulesets: %s" % bad if bad else 0)
          PY

      - name: Real end-to-end scan of fixtures
        run: bash job-security-scan/tests/e2e/run-e2e.sh

  advisory-live:
    name: Live advisory fetch and match
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch every source in sources.json
        run: |
          S=job-security-scan/scripts
          python3 -I $S/fetch-advisories.py --out "$RUNNER_TEMP/adv" \
            || { c=$?; [ $c -eq 3 ] && echo "::warning::some sources unreachable" || { echo "::error::fetch exit $c"; exit $c; }; }
          python3 -I $S/validate-advisories.py "$RUNNER_TEMP/adv/advisories" --strict --allow-duplicate-ids \
            || { echo "::error::fetched advisories failed schema validation"; exit 1; }
          n=$(ls "$RUNNER_TEMP/adv/advisories" | wc -l)
          echo "advisory files: $n"
          [ "$n" -ge 1 ] || { echo "::error::no advisories fetched"; exit 1; }
          python3 -I - "$RUNNER_TEMP/adv/manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          for k, v in sorted(m.get("sources", {}).items()):
              print("%-28s %s" % (k, v.get("status") if isinstance(v, dict) else v))
              if isinstance(v, dict) and v.get("status") != "ok":
                  print("::warning::source %s: %s" % (k, v))
          PY
      - name: Match fixtures against live data
        run: |
          S=job-security-scan/scripts; F=job-security-scan/tests/fixtures/node-22-14-demo
          python3 -I $S/match.py --repo $F --cache "$RUNNER_TEMP/adv" --fail-on none --format json --output "$RUNNER_TEMP/m22.json" >/dev/null
          python3 -I - "$RUNNER_TEMP/m22.json" <<'PY'
          import json, sys
          ids = {f["id"] for f in json.load(open(sys.argv[1]))["findings"] if f["component"] == "runtime:node"}
          if not ids: print("::error::Node 22.14.0 matched nothing against live data"); sys.exit(1)
          print("node 22.14.0 findings:", len(ids))
          PY
      - name: Runtime checks - EOL, unpinned, and the probe against real node images
        run: |
          S=job-security-scan/scripts; F=job-security-scan/tests/fixtures
          states() { python3 -I $S/match.py --repo "$1" ${2:+--inventory "$2"} --cache "$RUNNER_TEMP/adv" --fail-on none --format json \
            | python3 -c "import json,sys; print(' '.join(sorted({'%s/%s' % (f['state'], f['installed']) for f in json.load(sys.stdin)['findings'] if f['component']=='runtime:node'})))"; }
          states $F/node-18-eol | grep -q 'end-of-life/18.20.4' || { echo "::error::Node 18 not flagged end-of-life"; exit 1; }
          states $F/node-floating | grep -q 'unpinned/22' || { echo "::error::node:22-alpine not reported unpinned"; exit 1; }
          python3 -I $S/probe-runtime.py --repo $F/node-22-14-demo --output "$RUNNER_TEMP/probe.json"
          probed=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['components'][0]['version'])" "$RUNNER_TEMP/probe.json")
          real=$(docker run --rm node:22-bookworm-slim node -v | tr -d v)
          [ "$probed" = "$real" ] || { echo "::error::probe says $probed, node -v says $real"; exit 1; }
          echo "probe == node -v == $real"
          out=$(states $F/node-22-14-demo "$RUNNER_TEMP/probe.json")
          echo "$out" | grep -q 'affected/22.14.0' || { echo "::error::22.14.0 not flagged"; exit 1; }
          echo "$out" | grep -q "/$real" && { echo "::error::patched $real flagged: $out"; exit 1; }
          echo ok
      - name: Re-fetch produces no diff
        run: |
          S=job-security-scan/scripts
          (cd "$RUNNER_TEMP/adv" && find . -type f ! -name manifest.json | sort | xargs sha256sum) > "$RUNNER_TEMP/h1"
          python3 -I $S/fetch-advisories.py --out "$RUNNER_TEMP/adv" || [ $? -eq 3 ]
          (cd "$RUNNER_TEMP/adv" && find . -type f ! -name manifest.json | sort | xargs sha256sum) > "$RUNNER_TEMP/h2"
          diff "$RUNNER_TEMP/h1" "$RUNNER_TEMP/h2" || { echo "::error::second fetch changed files"; exit 1; }
      - name: Watch dry run
        run: python3 -I job-security-scan/scripts/advisory-watch.py --github-repo ${{ github.repository }} --cache "$RUNNER_TEMP/adv" --no-fetch --target job-security-scan/tests/fixtures/node-22-14-demo --dry-run
